version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: scifit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scifit}
      POSTGRES_USER: ${POSTGRES_USER:-scifit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scifit_local_pw}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/ingestion/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: scifit-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: scifit-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/provisioning:/etc/grafana/provisioning
    depends_on:
      - postgres

  app:
    build: .
    container_name: scifit-app
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
    volumes:
      - ./src:/app/src
      - ./streamlit_app:/app/streamlit_app
      - ./data:/app/data
    ports:
      - "8502:8501"
    depends_on:
      - postgres
      - qdrant
    command: streamlit run streamlit_app/app.py --server.address=0.0.0.0

volumes:
  postgres_data:
  qdrant_data:
  grafana_data:
